  sheet(`<h3>읽기 설정</h3>
    ${row("mode", "읽는 방식", R.mode === "story" ? "한 장씩 넘겨 보기" : "천천히 흘려 보기")}
    ${R.mode === "story" ? "" : row("speed", "속도", SPEEDS[R.sp].n)}
    ${row("fs", "글자 크기", R.fs === 1 ? "보통" : R.fs < 1.25 ? "크게" : "아주 크게")}
`);
}
$("#bMore").onclick = () => {
  R.anim?.pause();
  moreSheet();
};
const b64ToU8 = (b) => {
  const p = "=".repeat((4 - b.length % 4) % 4), r = atob((b + p).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from([...r].map((c) => c.charCodeAt(0)));
};
async function subscribePush() {
  if (isIOS && !standalone) return sheet(`<h3>아이폰은 한 번만 준비가 필요해요</h3><p class="lead" style="line-height:1.9">1. 주소창 옆 <b>···</b>(점 세 개)를 누르고<br>2. <b>공유</b>를 누른 뒤<br>3. 아래로 내려 <b>홈 화면에 추가</b>를 고르세요.<br>홈 화면에 생긴 '밤편지'로 열어서 이 버튼을 다시 누르면 알림이 켜져요.</p><button class="cta pri" onclick="closeSheet()">알겠어요</button>`);
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return toast("이 브라우저는 알림을 받을 수 없어요");
  try {
    const reg = await navigator.serviceWorker.register("sw.js");
    if (await Notification.requestPermission() !== "granted") return toast("알림이 꺼져 있어요. 설정에서 허용해 주세요");
    const { publicKey } = await (await fetch(LAPI + "/api/letter/vapid")).json();
    const sub = await reg.pushManager.getSubscription() || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64ToU8(publicKey) });
    const j = sub.toJSON();
    await fetch(LAPI + "/api/letter/subscribe", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ subscription: j }) });
    await fetch(LAPI + "/api/letter/test", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ endpoint: j.endpoint }) });
    store.set("push", true);
    ev("sub", "&how=push");
    toast("알림을 켰어요. 지금 시험 알림 하나가 갈 거예요");
  } catch (e) {
    toast("알림을 켜지 못했어요: " + e.message);
  }
}
if ("serviceWorker" in navigator && store.get("push", false)) navigator.serviceWorker.register("sw.js").catch(() => {
});
addEventListener("hashchange", route);
route();
</script>
