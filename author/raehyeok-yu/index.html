<main id="app"><div class="seo-fb"><h1>유래혁</h1><p>1994년에 태어나 홍익대학교에서 미술을 전공함. 타인의 삶을 보다 가까이 관찰하기 위해 7년간 거리에서 사진을 촬영했다. 사랑하는 이들을 위해 편지를 쓰는게 취미로, 20만자의 긴 편지를 쓰고자 소설가가 되었다. 소설로 하여금 우리가 같은 기억을 가지게 되기를, 그리하여 서로를 지극히 사랑할 수 있기를 바라며 작품 활동을 하고 있다. 소설 『수족관』 , 『바람은 도착하지 않는다』 를 썼다.</p><ul><li><a href="book/9791191891263/">당신과 아침에 싸우면 밤에는 입맞출 겁니다</a></li></ul></div></main>
