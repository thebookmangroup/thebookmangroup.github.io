<main id="app"><div class="seo-fb"><h1>김아영</h1><p>행복을 향해 걷는 이방인 소설책과 아이스크림을 좋아하던 아이였지만, 더 높은 곳으로 향하라는 사회의 압박에 지금까지 스스로를 채찍질하며 계속해서 달리는 삶을 살아왔다. 그 결과 대한항공에서 승무원으로, G1 방송에서 기자로 일하며 “한국방송기자대상”을 수상하게 되었다. 이후 MBC에 입사해 8년차 기자로 커리어를 쌓던 중 돌연 회사를 퇴사하고 글을 쓰기로 결심했다. 글쓰기를 좋아하던 어린 시절의 꿈을 이뤄보고 싶었다. 지금은 자신이 좋아하는 글을 쓰며 매일매일 작은 행복을 줍고 있다.</p><ul><li><a href="book/9791193937563/">모든 걸음에는 이유가 있다</a></li></ul></div></main>
