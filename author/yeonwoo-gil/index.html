<main id="app"><div class="seo-fb"><h1>길연우</h1><p>때로는 길을 잃는다. 그러므로 사람의 풍경을 좋아한다. 내면의 날씨를 정직하게 마주하며 함께 걸어가자는 말을 애정한다. 서로의 어깨에 가만히 머리를 기대고만 있어도 세상을 가진 것 같았던 여름을, 각자의 길에 쌓인 쓸쓸함을 밟으며 함께 발을 맞추던 가을을 이따금 펼쳐본다. 끝내 닿지 않는 소원들도 있겠지만 이미 내 곁에 머무는 소망들이 더 많다는 것을 이제는 안다. 녹지 않는 겨울의 발자국을 딛고 손끝에서 피어나는 작은 봄을 믿는다.</p><ul><li><a href="book/9791193937594/">다 좋아질 거야, 행복이 쏟아질 만큼</a></li></ul></div></main>
