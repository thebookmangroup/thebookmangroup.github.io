<main id="app"><h1>김경민</h1><p>서울대학교 지리학 학사, UC 버클리 정보시스템 석사를 거쳐 하버드대학교에서 도시계획·부동산 연구로 박사 학위를 받았다. 대한민국 최고의 부동산 전문가로, 현재 서울대학교 환경대학원 도시계획 전공 교수로 재직 중이다. 주요 연구 분야는 빅데이터 기반 부동산 시장 분석, 글로벌 오피스 비교, 공공민간협동개발 등이다. 저서로는 『부동산 트렌드 2023』, 『건축왕, 경성을 만들다』, 『도시개발, 길을 잃다』, 『리씽킹 서울』 등이 있다.</p><ul><li><a href="book/9791191891232/">머니 트렌드 2023</a></li></ul></main>
