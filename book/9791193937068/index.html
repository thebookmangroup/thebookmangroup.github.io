    const t = [...L].reverse().find(arrived) || L[0], nxt = L.find(l => !arrived(l));

      .gl-band .s,.gl-night .s{display:block;margin-top:16px;font:400 12.5px Pretendard,sans-serif;color:rgba(255,255,255,.42)}.gl-night .s.nth{margin-top:6px}.gl-night .s.nx{margin-top:30px;color:rgba(255,255,255,.6)}

      .gl-line i{font-style:normal;color:rgba(255,255,255,.55)}
      .gl-moon{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:inherit;margin-right:2px}.gl-moon svg{width:18px;height:18px}
      .gl-fade{position:fixed;inset:0;background:#0b0b0c;opacity:0;pointer-events:none;z-index:999;transition:opacity .9s ease}.gl-fade.on{opacity:1}
      .gl-night{position:relative;min-height:calc(100vh - 64px);min-height:calc(100svh - 64px);display:flex;align-items:center;justify-content:center;text-align:center;background:#0b0b0c;color:#f5f5f7;padding:60px 26px 90px;overflow:hidden}
      .gl-night .ph{position:absolute;inset:-6%;background:center/cover no-repeat;filter:blur(7px) brightness(.2);transform:scale(1.04)}
      .gl-night::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,transparent,rgba(11,11,12,.6) 80%);pointer-events:none}
      .gl-night .in{position:relative;z-index:1;max-width:560px}.gl-night .k{font:500 13px Pretendard,sans-serif;color:rgba(255,255,255,.55)}
      .gl-night .q{margin:30px 0 34px;font-size:clamp(17px,2.6vw,22px)}
      .gl-night .t{font:600 clamp(26px,4.4vw,38px)/1.3 Pretendard,sans-serif;letter-spacing:-.04em}
      .gl-night .dn{z-index:1;position:absolute;left:0;right:0;bottom:24px;font:500 12px Pretendard,sans-serif;color:rgba(255,255,255,.4)}
      @media(max-width:760px){.gl-wrap{margin-top:32px;margin-bottom:8px}.gl-band{flex-direction:column;align-items:flex-start;gap:16px;padding:24px 22px;border-radius:0}.gl-band .big{font-size:20px}.gl-band .gl-r{text-align:left}}
      body.gl-n #hdr{background:#0b0b0c!important;border-color:#0b0b0c!important}
      body.gl-n #hdr .logo img{filter:invert(1)}
      body.gl-n #hdr a,body.gl-n #hdr button{color:rgba(255,255,255,.85)!important}
      body.gl-n #hdr .lang button{border-color:rgba(255,255,255,.4)!important}

      html[lang=en] body.gl-n #hdr{background:var(--paper)!important;border-color:var(--rule)!important}html[lang=en] body.gl-n #hdr .logo img{filter:none}
      html[lang=en] body.gl-n #hdr a,html[lang=en] body.gl-n #hdr button{color:var(--ink)!important}html[lang=en] body.gl-n #hdr .lang button{border-color:var(--ink)!important}
      html[lang=en] body.gl-n #hdr .lang button.on{color:var(--paper)!important}`;   /* 대표 10-19: 영어판에는 밤편지 없음 */
    document.head.appendChild(st);
    const f = document.createElement('link'); f.rel = 'stylesheet'; f.href = 'https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300&display=swap'; document.head.appendChild(f);

    // '약 N시간 뒤'는 밤 10시 3시간 안쪽(저녁 7시~)에만 (대표 10-19)
    // 낮의 띠 (대표 10-19: 오늘 밤 10시가 주인공 · 홈페이지 다른 칸과 어울리게 본문 폭 안의 낮은 카드로)
    const band = () => `<div class="wrap gl-wrap"><section class="gl-band">
      <div class="gl-l"><div class="k">책 읽어주는 남자 밤편지</div>
        <div class="big">${nxt ? '오늘 밤 10시, 새 편지가 도착합니다' : '새 편지는 매일 밤 10시에 도착합니다'}</div>
        ${nxt && (new Date(`${nxt.date}T22:00:00+09:00`) - Date.now()) <= 3 * 3600e3 ? `<div class="when">${soon()}</div>` : ''}</div>
      <div class="gl-r"><div class="t2">지난밤의 편지 · No.${t.no} ${esc(t.title)}</div>

      <div class="t">${esc(t.title)}</div><a class="b" href="${LETTER}#/l/${t.no}">편지 읽기</a>

      else { document.querySelector('.gl-night')?.remove(); const rl = document.querySelector('#app .reach-line'); const at = rl ? rl.parentElement : hero;   // 대표 10-19: '책이 나오면 먼저 읽어 드립니다' 줄 아래, 오늘의 한 문장 위
        if (at && !document.querySelector('.gl-band')) at.insertAdjacentHTML('afterend', band()) }
      const m = (location.hash + location.pathname).match(/book\/(\d{13})/);
      if (m && !document.querySelector('.gl-line')) {
        const hit = [...L].reverse().filter(arrived).find(l => l.items.some(i => i.isbn === m[1])), h1 = document.querySelector('#app h1');
        if (hit && h1) h1.insertAdjacentHTML('afterend', `<a class="gl-line" href="${LETTER}#/l/${hit.no}">✉ 이 책의 문장이 실린 밤편지 <i>No.${hit.no} ${esc(hit.title)} →</i></a>`);
      }
    }
    function fadeTo(m) { const fd = document.querySelector('.gl-fade'); fd.classList.add('on'); setTimeout(() => { MODE = m; decorate(); scrollTo(0, 0); setTimeout(() => fd.classList.remove('on'), 120) }, 900) }
    decorate();
    new MutationObserver(decorate).observe(document.getElementById('app'), { childList: true });
    new MutationObserver(decorate).observe(document.getElementById('nav'), { childList: true });
  }
})();
